# Pushing a tag like v2.1 builds the signed release APK and publishes a GitHub Release with it attached,
# which Obtainium picks up. Nothing else triggers it: merges to main publish nothing.
#
# Secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
# To publish into another repo instead (e.g. a public releases-only repo), set the repo variable
# RELEASE_REPO to owner/name and the secret RELEASE_TOKEN to a token with contents: write on that repo.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count, so it needs the full history
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew --no-daemon test assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "plateline-$GITHUB_REF_NAME.apk"
          rm "$RELEASE_KEYSTORE"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "plateline-$GITHUB_REF_NAME.apk" --repo "$REPO" --title "$GITHUB_REF_NAME" --notes "Plateline $GITHUB_REF_NAME"
